name: Platform consolidation qualification
on:
  pull_request:
  push:
    branches: [feat/platform-consolidation-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rkjo
          POSTGRES_USER: rkjo
          POSTGRES_PASSWORD: rkjo_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rkjo -d rkjo"
          --health-interval 5s --health-timeout 5s --health-retries 12
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: rkjo
          RABBITMQ_DEFAULT_PASS: rkjo_password
        ports: ["5672:5672", "15672:15672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RKJO_TEST_DATABASE_URL: postgresql://rkjo:rkjo_password@localhost:5432/rkjo
      RKJO_DATABASE_URL: postgresql://rkjo:rkjo_password@localhost:5432/rkjo
      DATABASE_URL: postgresql://rkjo:rkjo_password@localhost:5432/rkjo
      RABBITMQ_URL: amqp://rkjo:rkjo_password@localhost:5672/
      RKJO_TEST_RABBITMQ_URL: amqp://rkjo:rkjo_password@localhost:5672/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-fra
      - run: python -m pip install -r requirements-test-lock.txt
      - run: python -m pip install --no-deps ./platform/kernel
      - name: Verify installed kernel outside repository
        working-directory: /tmp
        run: python -c "import rkjo_kernel.harness, rkjo_kernel.tools, rkjo_kernel.voice, rkjo_kernel.omnichannel"
      - run: python -m pytest tests -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-results
          path: test-results.xml
